events {
  worker_connections 1024;
}

http {
  server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;

    # No limit on upload size (streamseal handles arbitrarily large files)
    client_max_body_size 0;

    # Stream upload chunks to Node.js as they arrive (no buffering).
    # Required for fetch duplex:"half" streaming to reach Node.js incrementally.
    proxy_request_buffering off;
    proxy_buffering         off;

    # Generous timeouts for large file uploads
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
      proxy_pass         http://node:8080;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-Proto https;
    }
  }
}
