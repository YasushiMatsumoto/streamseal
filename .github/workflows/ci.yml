name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack dry run
        run: npm run pack:dry-run

      - name: Packed artifact import smoke test
        run: |
          mkdir -p .tmp/smoke
          npm pack --pack-destination .tmp
          cd .tmp/smoke
          npm init -y
          npm install ../streamseal-*.tgz
          node --input-type=module -e "await import('streamseal'); await import('streamseal/server');"
